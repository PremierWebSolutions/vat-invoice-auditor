name: citation-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Citation/quote checker self-test (must itself be provably alive)
        run: python3 tools/check_citations.py --self-test
      - name: Validate every citation and quote against reference/ and fixtures/
        run: python3 tools/check_citations.py
      - name: Arithmetic checker self-test (must itself be provably alive)
        run: python3 tools/check_arithmetic.py --self-test
      - name: Recompute every fixture's arithmetic from its own stated numbers
        run: python3 tools/check_arithmetic.py
      - name: No-network scanner self-test (must itself be provably alive)
        run: python3 tools/check_no_network.py --self-test
      - name: Prove the checkers make no network, subprocess or LLM call
        run: python3 tools/check_no_network.py
      - name: Reference integrity self-test (must itself be provably alive)
        run: python3 tools/check_reference_integrity.py --self-test
      - name: Verify every reference/ file against its recorded SHA-256
        run: python3 tools/check_reference_integrity.py
